name: Live data audit
on:
  push:
    paths: ["tools/**", ".github/workflows/audit.yml", "index.html"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save jsdom@24
      - run: mkdir -p audit && node tools/audit.mjs > audit/report-${{ matrix.batch }}.md 2> audit/stderr-${{ matrix.batch }}.txt || true
        env:
          OPENALEX_KEY: ${{ secrets.OPENALEX_KEY }}
          EXTRA_NAMES: ${{ vars.EXTRA_NAMES }}
          BATCH: ${{ matrix.batch }}/4
      - name: Commit report
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add audit
          git commit -m "Audit report ${{ matrix.batch }} [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((RANDOM % 8 + 2)); done
